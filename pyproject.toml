[project]
name = "mistral-uq-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Neo-ENSAI", email = "neo.grandhaye@eleve.ensai.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "aiolimiter>=1.3.0",
    "datasets>=5.1.0",
    "langfuse>=3.90.1",
    "mistralai>=1.0.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[project.scripts]
mistral-conformal-eval = "mistral_eval.cli:app"
